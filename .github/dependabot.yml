version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      # One PR a week for every minor and patch update: each PR costs a
      # Dependabot job, the required check and a deploy. Majors still group by
      # family below, since those packages only work at matching versions.
      groups:
          minor-and-patch:
              patterns: ['*']
              update-types: [minor, patch]
          next:
              patterns: [next, '@next/*', eslint-config-next]
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          eslint:
              patterns: ['eslint', '@eslint/*']
      ignore:
          # `typescript` here is an alias for @typescript/typescript6 (the API
          # typescript-eslint and next build load); TS 7 itself updates through
          # @typescript/native, so Dependabot must not bump the alias key to 7.
          - dependency-name: typescript
            versions: ['>=7']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ['*']
