version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          next:
              patterns: [next, '@next/*', eslint-config-next]
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          eslint:
              patterns: ['eslint', '@eslint/*']
      ignore:
          # `typescript` here is an alias for @typescript/typescript6 (the API
          # typescript-eslint and next build load); TS 7 itself updates through
          # @typescript/native, so Dependabot must not bump the alias key to 7.
          - dependency-name: typescript
            versions: ['>=7']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
