version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          next:
              patterns: [next, '@next/*', eslint-config-next]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
