name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

# Never cancel a release halfway through the upload.
concurrency:
    group: deploy-brief
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    deploy:
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build
            - uses: Jubstaaa/deploy-actions/ssh@49eae2ffd4e60ca7b69323f622d7f06e97bbe1b2 # v1.2.0
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  user: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
            # Atomic release: the site switches to the new build in one rename, and
            # goes back to the previous one if it does not answer.
            - uses: Jubstaaa/deploy-actions/static@49eae2ffd4e60ca7b69323f622d7f06e97bbe1b2 # v1.2.0
              with:
                  source-dir: out
                  site: brief
                  health-url: https://brief.ilkerbalcilar.com/
