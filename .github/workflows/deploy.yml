name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:
        secrets:
            DEPLOY_HOST:
                required: true
            DEPLOY_USER:
                required: true
            DEPLOY_SSH_KEY:
                required: true
            DEPLOY_KNOWN_HOSTS:
                required: true

permissions:
    contents: read

# Never cancel a release halfway through the upload.
concurrency:
    group: deploy-brief
    cancel-in-progress: false

# No gate here: main only accepts commits whose required `check` passed on a
# branch that was up to date with main (strict status checks), so what lands on
# main is what CI already checked. The weekly run gates before it calls the
# model. A manual dispatch is the redeploy path and skips the gate on purpose,
# which is why it only ever deploys main.
jobs:
    deploy:
        if: github.ref == 'refs/heads/main'
        # The environment only accepts main, enforced by GitHub, so a branch
        # that edits the guard above still cannot deploy.
        environment:
            name: production
            url: https://brief.ilkerbalcilar.com/
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build
            - uses: Jubstaaa/deploy-actions/ssh@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  user: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
            # Atomic release: the site switches to the new build in one rename, and
            # goes back to the previous one if it does not answer.
            - uses: Jubstaaa/deploy-actions/static@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  source-dir: out
                  site: brief
                  # The weekly run and a redeploy ship an unchanged main. Named by
                  # SHA alone, that release is the live one: the action would
                  # upload into the served directory and roll back to itself.
                  release: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  health-url: https://brief.ilkerbalcilar.com/

    # A deploy dispatched by the Dependabot auto-merge runs as the bot, so
    # GitHub's failure e-mail reaches nobody; an issue notifies the owner.
    alert:
        needs: deploy
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Open or update the deploy-failure issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  TITLE: Production deploy failed
              run: |
                  body="Run: $RUN_URL (commit $GITHUB_SHA). Production may be on the previous release or down; check the deploy log."
                  existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "$body"
                  else
                      gh issue create --title "$TITLE" --body "$body"
                  fi
