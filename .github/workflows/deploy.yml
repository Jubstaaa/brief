name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-brief
    cancel-in-progress: false

jobs:
    deploy:
        if: github.ref == 'refs/heads/main'
        environment:
            name: production
            url: https://brief.ilkerbalcilar.com/
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build
            - uses: Jubstaaa/deploy-actions/ssh@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  user: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
            - uses: Jubstaaa/deploy-actions/static@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  source-dir: out
                  site: brief
                  release: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  health-url: https://brief.ilkerbalcilar.com/

    alert:
        needs: deploy
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Open or update the deploy-failure issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  TITLE: Production deploy failed
              run: |
                  body="Run: $RUN_URL (commit $GITHUB_SHA). Production may be on the previous release or down; check the deploy log."
                  gh label create deploy-failure --force --color B60205 \
                      --description 'Opened by the deploy workflow'
                  existing=$(gh issue list --state open --author app/github-actions \
                      --label deploy-failure --search "\"$TITLE\" in:title" \
                      --json number,author \
                      --jq '[.[] | select(.author.is_bot and .author.login == "app/github-actions")][0].number // empty')
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "$body"
                  else
                      gh issue create --title "$TITLE" --body "$body" --label deploy-failure
                  fi
