name: Weekly

on:
    workflow_dispatch:
        inputs:
            since:
                description: 'Backfill start: ISO date-time with Z or offset, e.g. 2026-11-10T06:00:00Z; pass with until'
                required: false
            until:
                description: 'Backfill end: ISO date-time with Z or offset, at most 14 days after since, not in the future; pass with since'
                required: false
            week:
                description: 'Optional check: YYYY-MM-DD, must be the Istanbul date the window ends on'
                required: false

concurrency:
    group: weekly
    cancel-in-progress: false

jobs:
    # The full gate runs before the model calls, which are the only part of the
    # run that costs money.
    ci:
        # A dispatch from another branch would run that branch's script with the
        # inference and bucket keys.
        if: github.ref == 'refs/heads/main'
        uses: ./.github/workflows/ci.yml

    generate:
        needs: ci
        runs-on: ubuntu-latest
        # A normal run takes about two minutes; the default is six hours.
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile

            - name: Generate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DO_INFERENCE_API_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
                  SPACES_KEY: ${{ secrets.SPACES_KEY }}
                  SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
                  # Inputs reach the shell as environment variables, never as
                  # interpolated script text.
                  SINCE: ${{ inputs.since }}
                  UNTIL: ${{ inputs.until }}
                  WEEK: ${{ inputs.week }}
              run: |
                  args=()
                  [ -n "$SINCE" ] && args+=("--since=$SINCE")
                  [ -n "$UNTIL" ] && args+=("--until=$UNTIL")
                  [ -n "$WEEK" ] && args+=("--week=$WEEK")
                  bun run scripts/generate.ts "${args[@]}"

    publish:
        needs: generate
        uses: ./.github/workflows/deploy.yml
        # Only what the deploy needs; the inference and bucket keys stay here.
        secrets:
            DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
            DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
            DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
