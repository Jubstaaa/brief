name: Weekly

on:
    workflow_dispatch:
        inputs:
            since:
                description: 'Backfill start: ISO date-time with Z or offset, e.g. 2026-11-10T06:00:00Z; pass with until'
                required: false
            until:
                description: 'Backfill end: ISO date-time with Z or offset, at most 14 days after since, not in the future; pass with since'
                required: false
            week:
                description: 'Optional check: YYYY-MM-DD, must be the Istanbul date the window ends on'
                required: false

concurrency:
    group: weekly
    cancel-in-progress: false

jobs:
    ci:
        if: github.ref == 'refs/heads/main'
        uses: ./.github/workflows/ci.yml

    generate:
        needs: ci
        environment: weekly
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile

            - name: Generate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DO_INFERENCE_API_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
                  SPACES_KEY: ${{ secrets.SPACES_KEY }}
                  SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
                  SINCE: ${{ inputs.since }}
                  UNTIL: ${{ inputs.until }}
                  WEEK: ${{ inputs.week }}
              run: |
                  args=()
                  [ -n "$SINCE" ] && args+=("--since=$SINCE")
                  [ -n "$UNTIL" ] && args+=("--until=$UNTIL")
                  [ -n "$WEEK" ] && args+=("--week=$WEEK")
                  bun run scripts/generate.ts "${args[@]}"

    publish:
        needs: generate
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            actions: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Dispatch the deploy and wait for it
              run: |
                  url=$(gh workflow run deploy.yml --ref main)
                  run_id=${url##*/}
                  [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "no run id in: $url" >&2; exit 1; }
                  echo "Deploy run: $url"
                  for _ in $(seq 1 120); do
                      state=$(gh run view "$run_id" --json status,conclusion \
                          --jq '"\(.status) \(.conclusion)"' || true)
                      case "$state" in completed*) break ;; esac
                      sleep 15
                  done
                  echo "Deploy run finished: $state"
                  [ "$state" = "completed success" ]
