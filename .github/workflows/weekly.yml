name: Weekly

on:
    workflow_dispatch:
        inputs:
            since:
                description: 'Backfill start: ISO date-time with Z or offset, e.g. 2026-11-10T06:00:00Z; pass with until'
                required: false
            until:
                description: 'Backfill end: ISO date-time with Z or offset, at most 14 days after since, not in the future; pass with since'
                required: false
            week:
                description: 'Optional check: YYYY-MM-DD, must be the Istanbul date the window ends on'
                required: false

concurrency:
    group: weekly
    cancel-in-progress: false

jobs:
    # The full gate runs before the model calls, which are the only part of the
    # run that costs money.
    ci:
        # A dispatch from another branch would run that branch's script with the
        # inference and bucket keys.
        if: github.ref == 'refs/heads/main'
        uses: ./.github/workflows/ci.yml

    generate:
        needs: ci
        # The inference and bucket keys live in this environment, which only
        # accepts main.
        environment: weekly
        runs-on: ubuntu-latest
        # A normal run takes about two minutes; the default is six hours.
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile

            - name: Generate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DO_INFERENCE_API_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
                  SPACES_KEY: ${{ secrets.SPACES_KEY }}
                  SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
                  # Inputs reach the shell as environment variables, never as
                  # interpolated script text.
                  SINCE: ${{ inputs.since }}
                  UNTIL: ${{ inputs.until }}
                  WEEK: ${{ inputs.week }}
              run: |
                  args=()
                  [ -n "$SINCE" ] && args+=("--since=$SINCE")
                  [ -n "$UNTIL" ] && args+=("--until=$UNTIL")
                  [ -n "$WEEK" ] && args+=("--week=$WEEK")
                  bun run scripts/generate.ts "${args[@]}"

    # The deploy secrets live in the production environment, and a called
    # workflow does not receive them, so the deploy runs as its own workflow
    # run and this job waits for it. Its alert job opens the failure issue.
    publish:
        needs: generate
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            actions: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Dispatch the deploy and wait for it
              run: |
                  # The dispatch returns the URL of the run it created, so a
                  # deploy started by someone else at the same time is never
                  # mistaken for this one.
                  url=$(gh workflow run deploy.yml --ref main)
                  run_id=${url##*/}
                  [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "no run id in: $url" >&2; exit 1; }
                  echo "Deploy run: $url"
                  # gh run watch asks for the jobs of a run that is only seconds
                  # old and gets a 404, so poll the run itself.
                  for _ in $(seq 1 120); do
                      state=$(gh run view "$run_id" --json status,conclusion \
                          --jq '"\(.status) \(.conclusion)"' || true)
                      case "$state" in completed*) break ;; esac
                      sleep 15
                  done
                  echo "Deploy run finished: $state"
                  [ "$state" = "completed success" ]
