name: Weekly

on:
    schedule:
        - cron: '0 6 * * 2'
    workflow_dispatch:
        inputs:
            since:
                description: 'ISO start of window (optional)'
                required: false
            until:
                description: 'ISO end of window (optional)'
                required: false
            week:
                description: 'Week label, YYYY-MM-DD (optional)'
                required: false

concurrency:
    group: weekly
    cancel-in-progress: false

jobs:
    generate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun test
            - run: bun run type-check

            - name: Generate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DO_INFERENCE_API_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
                  SPACES_KEY: ${{ secrets.SPACES_KEY }}
                  SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
              run: |
                  args=""
                  [ -n "${{ inputs.since }}" ] && args="$args --since=${{ inputs.since }}"
                  [ -n "${{ inputs.until }}" ] && args="$args --until=${{ inputs.until }}"
                  [ -n "${{ inputs.week }}" ] && args="$args --week=${{ inputs.week }}"
                  bun run scripts/generate.ts $args

    publish:
        needs: generate
        uses: ./.github/workflows/deploy.yml
        secrets: inherit
