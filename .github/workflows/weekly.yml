name: Weekly

on:
    workflow_dispatch:
        inputs:
            since:
                description: 'ISO start of window (optional)'
                required: false
            until:
                description: 'ISO end of window (optional)'
                required: false
            week:
                description: 'Week label, YYYY-MM-DD; must be the Istanbul date the window ends (optional)'
                required: false

concurrency:
    group: weekly
    cancel-in-progress: false

jobs:
    # The full gate runs before the model calls, which are the only part of the
    # run that costs money.
    ci:
        uses: ./.github/workflows/ci.yml

    generate:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile

            - name: Generate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DO_INFERENCE_API_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
                  SPACES_KEY: ${{ secrets.SPACES_KEY }}
                  SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
                  # Inputs reach the shell as environment variables, never as
                  # interpolated script text.
                  SINCE: ${{ inputs.since }}
                  UNTIL: ${{ inputs.until }}
                  WEEK: ${{ inputs.week }}
              run: |
                  args=()
                  [ -n "$SINCE" ] && args+=("--since=$SINCE")
                  [ -n "$UNTIL" ] && args+=("--until=$UNTIL")
                  [ -n "$WEEK" ] && args+=("--week=$WEEK")
                  bun run scripts/generate.ts "${args[@]}"

    publish:
        needs: generate
        uses: ./.github/workflows/deploy.yml
        secrets: inherit
